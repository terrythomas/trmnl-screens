[project]
name = "trmnl-screens"
version = "0.1.0"
description = "Collectors that push data to LaraPaper for custom TRMNL screens"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["collector*"]

[tool.pytest.ini_options]
testpaths = ["tests", "screens"]
addopts = "--import-mode=importlib"
